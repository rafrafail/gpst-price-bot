name: tg-bot-template-api

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.3
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?TELEGRAM_API_ID is required}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?TELEGRAM_API_HASH is required}
      TELEGRAM_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_TEMP_DIR: /tmp/telegram-bot-api
      TELEGRAM_LOCAL: "true"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api

volumes:
  telegram_bot_api_data:
