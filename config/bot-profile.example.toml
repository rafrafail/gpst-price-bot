# Пример публичного профиля бота.
# Сохраните как config/bot-profile.toml и укажите путь в BOT_PROFILE_PATH.
# Секреты (токен, ключи) НЕ кладите сюда — они остаются в .env / окружении.

[bot]
title = "Мой сервис"
welcome = "Добро пожаловать! Выберите раздел."
help = "Здесь можно узнать о сервисе и настроить уведомления.\nМеню переключается в одном сообщении. «Назад» возвращает на прошлый экран.\n«Главное меню» не удаляет черновики и не останавливает рассылку.\n/menu — открыть меню\n/cancel — отменить текущий ввод\nГотовые результаты и предпросмотры остаются в переписке."
support_url = "https://t.me/example_support"

[example]
enabled = false

[menu]
order = ["about", "preferences", "help", "broadcasts"]

[[sections]]
id = "about"
label = "О сервисе"
text = "Краткое описание вашего продукта."

[[sections]]
id = "features"
label = "Возможности"
text = "Что умеет этот бот:\n— Быстрые уведомления\n— Удобное меню\n— Настройка под себя"