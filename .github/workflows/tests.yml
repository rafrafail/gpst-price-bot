name: Template v2 checks
# Manual diagnostic fallback only; acceptance uses the external X-CICD MCP gate.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m compileall -q bot_template tests main.py
      - run: python -m pytest -q
      - run: python main.py --check
