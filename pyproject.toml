[project]
name = "telegram-bot-template"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = ["aiogram==3.22.0", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=_work/pytest"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["_work", "core", "features", "prompts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
